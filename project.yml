name: Rackside
options:
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Rackside:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    settings:
      base:
        DEVELOPMENT_TEAM: ZD9JLCY7TF
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.madacgrav.trainme
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Sources/Rackside.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: RacksideWatch
  RacksideWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - Watch
      - Shared
      - path: Sources/AppIcon.icon
        buildPhase: resources
      - path: Sources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ZD9JLCY7TF
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.madacgrav.trainme.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rackside
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.madacgrav.trainme
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  RacksideTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Rackside
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Rackside:
    build:
      targets:
        Rackside: all
    test:
      targets: [RacksideTests]
  RacksideWatch:
    build:
      targets:
        RacksideWatch: all

name: TrainMe
options:
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  TrainMe:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    settings:
      base:
        DEVELOPMENT_TEAM: ZD9JLCY7TF
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.madacgrav.trainme
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Sources/TrainMe.entitlements
    dependencies:
      - target: TrainMeWatch
  TrainMeWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources: [Watch, Shared]
    settings:
      base:
        DEVELOPMENT_TEAM: ZD9JLCY7TF
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.madacgrav.trainme.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TrainMe
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.madacgrav.trainme
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  TrainMeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: TrainMe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TrainMe:
    build:
      targets:
        TrainMe: all
    test:
      targets: [TrainMeTests]
  TrainMeWatch:
    build:
      targets:
        TrainMeWatch: all
